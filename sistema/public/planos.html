<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Planos de Tratamento - FisioSys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success px-4">
    <a class="navbar-brand fw-bold" href="/dashboard.html">← Voltar ao Painel</a>
    <div class="ms-auto text-white">
      <span class="me-3" id="nomeUsuario"></span>
      <button onclick="logout()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold">Cadastrar Plano de Tratamento</div>
      <div class="card-body">
        <form id="formPlano" class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Paciente Associado</label>
            <select id="paciente_id" class="form-select" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Descrição</label>
            <input type="text" id="descricao" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Qtd. Sessões</label>
            <input type="number" id="qtd_sessoes" class="form-control" min="1" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" id="valor" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-success">Salvar Plano</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Descrição</th>
              <th>Sessões</th>
              <th>Valor (R$)</th>
            </tr>
          </thead>
          <tbody id="tabelaPlanos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
    if (!token) window.location.href = '/index.html';
    document.getElementById('nomeUsuario').textContent = usuario.nome;

    function logout() { localStorage.clear(); window.location.href = '/index.html'; }

    async function apiFetch(url, options = {}) {
      options.headers = { ...options.headers, 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
      const res = await fetch(url, options);
      if (res.status === 401) { localStorage.clear(); window.location.href = '/index.html?expirado=1'; }
      return res;
    }

    async function inicializar() {
      const resPac = await apiFetch('/api/pacientes');
      const pacientes = await resPac.json();
      document.getElementById('paciente_id').innerHTML =
        '<option value="">Selecione...</option>' +
        pacientes.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');

      const resPlanos = await apiFetch('/api/planos');
      const planos = await resPlanos.json();
      document.getElementById('tabelaPlanos').innerHTML = planos.map(pl => `
        <tr>
          <td>${pl.id}</td>
          <td><strong>${pl.paciente_nome}</strong></td>
          <td>${pl.descricao}</td>
          <td>${pl.qtd_sessoes}</td>
          <td>R$ ${Number(pl.valor).toFixed(2)}</td>
        </tr>
      `).join('');
    }

    document.getElementById('formPlano').addEventListener('submit', async (e) => {
      e.preventDefault();
      await apiFetch('/api/planos', {
        method: 'POST',
        body: JSON.stringify({
          paciente_id: document.getElementById('paciente_id').value,
          descricao: document.getElementById('descricao').value,
          qtd_sessoes: document.getElementById('qtd_sessoes').value,
          valor: document.getElementById('valor').value
        })
      });
      e.target.reset();
      inicializar();
    });

    inicializar();
  </script>
</body>
</html>
