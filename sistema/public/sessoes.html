<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sessões - FisioSys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/dashboard.html">← Voltar ao Painel</a>
    <div class="ms-auto text-white">
      <span class="me-3" id="nomeUsuario"></span>
      <button onclick="logout()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold">Agendar Nova Sessão</div>
      <div class="card-body">
        <form id="formSessao" class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Paciente</label>
            <select id="paciente_id" class="form-select" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Plano de Tratamento</label>
            <select id="plano_id" class="form-select" required></select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Data</label>
            <input type="date" id="data_sessao" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Horário</label>
            <input type="time" id="horario" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Agendar Sessão</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white fw-bold">Agenda de Sessões (Ordenada por Dia)</div>
      <div class="card-body table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Data / Horário</th>
              <th>Dados Completos do Paciente</th>
              <th>Dados do Plano de Tratamento</th>
              <th>Atualizar Data da Sessão</th>
            </tr>
          </thead>
          <tbody id="tabelaSessoes"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
    if (!token) window.location.href = '/index.html';
    document.getElementById('nomeUsuario').textContent = usuario.nome;

    function logout() { localStorage.clear(); window.location.href = '/index.html'; }

    async function apiFetch(url, options = {}) {
      options.headers = { ...options.headers, 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
      const res = await fetch(url, options);
      if (res.status === 401) { localStorage.clear(); window.location.href = '/index.html?expirado=1'; }
      return res;
    }

    async function carregarTudo() {
      const [resPac, resPlanos, resSessoes] = await Promise.all([
        apiFetch('/api/pacientes'),
        apiFetch('/api/planos'),
        apiFetch('/api/sessoes')
      ]);

      const pacientes = await resPac.json();
      const planos = await resPlanos.json();
      const sessoes = await resSessoes.json();

      document.getElementById('paciente_id').innerHTML =
        '<option value="">Selecione...</option>' +
        pacientes.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');

      document.getElementById('plano_id').innerHTML =
        '<option value="">Selecione...</option>' +
        planos.map(pl => `<option value="${pl.id}">${pl.paciente_nome} - ${pl.descricao}</option>`).join('');

      document.getElementById('tabelaSessoes').innerHTML = sessoes.map(s => `
        <tr>
          <td>
            <strong>${s.data_sessao}</strong><br>
            <span class="text-muted">${s.horario} (${s.status})</span>
          </td>
          <td>
            <strong>${s.paciente.nome}</strong><br>
            <small>CPF: ${s.paciente.cpf} | Tel: ${s.paciente.telefone} | Nasc: ${s.paciente.data_nascimento}</small>
          </td>
          <td>
            <strong>${s.plano.descricao}</strong><br>
            <small>${s.plano.qtd_sessoes} sessões | R$ ${Number(s.plano.valor).toFixed(2)}</small>
          </td>
          <td>
            <div class="d-flex gap-2">
              <input type="date" id="data_${s.sessao_id}" class="form-control form-control-sm" value="${s.data_sessao}">
              <button class="btn btn-sm btn-warning" onclick="atualizarData(${s.sessao_id})">Salvar</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function atualizarData(id) {
      const nova_data = document.getElementById(`data_${id}`).value;
      await apiFetch(`/api/sessoes/${id}/data`, {
        method: 'PUT',
        body: JSON.stringify({ data_sessao: nova_data })
      });
      carregarTudo();
    }

    document.getElementById('formSessao').addEventListener('submit', async (e) => {
      e.preventDefault();
      await apiFetch('/api/sessoes', {
        method: 'POST',
        body: JSON.stringify({
          paciente_id: document.getElementById('paciente_id').value,
          plano_id: document.getElementById('plano_id').value,
          data_sessao: document.getElementById('data_sessao').value,
          horario: document.getElementById('horario').value
        })
      });
      e.target.reset();
      carregarTudo();
    });

    carregarTudo();
  </script>
</body>
</html>
