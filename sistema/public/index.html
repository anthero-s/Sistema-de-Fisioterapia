<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - FisioSys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h4 class="text-center text-primary mb-3">FisioSys - Acesso</h4>
    <div id="alerta" class="alert alert-danger d-none py-2"></div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" placeholder="use:anthero@fisio.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="use:123456" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    <small class="text-muted text-center mt-3 d-block">Token JWT expira automaticamente em 15 minutos.</small>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('expirado')) {
      const alerta = document.getElementById('alerta');
      alerta.textContent = 'Sessão expirada! Faça login novamente.';
      alerta.classList.remove('d-none');
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });

      const data = await res.json();
      if (!res.ok) {
        const alerta = document.getElementById('alerta');
        alerta.textContent = data.erro;
        alerta.classList.remove('d-none');
        return;
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('usuario', JSON.stringify(data.usuario));
      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
