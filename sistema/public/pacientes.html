<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pacientes - FisioSys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/dashboard.html">← Voltar ao Painel</a>
    <div class="ms-auto text-white">
      <span class="me-3" id="nomeUsuario"></span>
      <button onclick="logout()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold" id="tituloForm">Cadastrar Novo Paciente</div>
      <div class="card-body">
        <form id="formPaciente" class="row g-3">
          <input type="hidden" id="pacienteId">
          <div class="col-md-4">
            <label class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">CPF (Criptografado no BD)</label>
            <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Telefone</label>
            <input type="text" id="telefone" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Nascimento</label>
            <input type="date" id="data_nascimento" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" id="btnCancelar" class="btn btn-secondary d-none" onclick="resetarForm()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Busca -->
    <div class="card shadow-sm mb-3">
      <div class="card-body d-flex gap-2">
        <input type="text" id="campoBusca" class="form-control" placeholder="Digite o termo de busca (nome ou telefone)...">
        <button class="btn btn-dark" onclick="carregarPacientes()">Buscar</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>CPF (Descriptografado)</th>
              <th>Telefone</th>
              <th>Nascimento</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="tabelaPacientes"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
    if (!token) window.location.href = '/index.html';
    document.getElementById('nomeUsuario').textContent = usuario.nome;

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    async function apiFetch(url, options = {}) {
      options.headers = {
        ...options.headers,
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
      const res = await fetch(url, options);
      if (res.status === 401) {
        localStorage.clear();
        window.location.href = '/index.html?expirado=1';
      }
      return res;
    }

    async function carregarPacientes() {
      const termo = document.getElementById('campoBusca').value;
      const res = await apiFetch(`/api/pacientes?busca=${encodeURIComponent(termo)}`);
      const lista = await res.json();

      const tbody = document.getElementById('tabelaPacientes');
      tbody.innerHTML = lista.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.nome}</td>
          <td><span class="badge bg-secondary">${p.cpf}</span></td>
          <td>${p.telefone}</td>
          <td>${p.data_nascimento}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick='editarPaciente(${JSON.stringify(p)})'>Editar</button>
          </td>
        </tr>
      `).join('');
    }

    function editarPaciente(p) {
      document.getElementById('tituloForm').textContent = `Editar Paciente #${p.id}`;
      document.getElementById('pacienteId').value = p.id;
      document.getElementById('nome').value = p.nome;
      document.getElementById('cpf').value = p.cpf.includes('Protegido') ? '' : p.cpf;
      document.getElementById('telefone').value = p.telefone;
      document.getElementById('data_nascimento').value = p.data_nascimento;
      document.getElementById('btnCancelar').classList.remove('d-none');
    }

    function resetarForm() {
      document.getElementById('formPaciente').reset();
      document.getElementById('pacienteId').value = '';
      document.getElementById('tituloForm').textContent = 'Cadastrar Novo Paciente';
      document.getElementById('btnCancelar').classList.add('d-none');
    }

    document.getElementById('formPaciente').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('pacienteId').value;
      const payload = {
        nome: document.getElementById('nome').value,
        cpf: document.getElementById('cpf').value,
        telefone: document.getElementById('telefone').value,
        data_nascimento: document.getElementById('data_nascimento').value
      };

      if (id) {
        await apiFetch(`/api/pacientes/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await apiFetch('/api/pacientes', { method: 'POST', body: JSON.stringify(payload) });
      }

      resetarForm();
      carregarPacientes();
    });

    carregarPacientes();
  </script>
</body>
</html>
